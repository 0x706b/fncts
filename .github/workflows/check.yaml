name: Check
on:
  pull_request:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Install node
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install
          corepack enable

      - uses: actions/cache@v5
        with:
          path: ".yarn/cache"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      - uses: actions/cache@v5
        with:
          path: "node_modules/.experimental-vitest-cache"
          key: ${{ runner.os }}-vitest-${{ hashFiles('node_modules/.experimental-vitest-cache/**') }}

      - name: Install
        run: |
          yarn install --immutable

      - name: Lint
        run: |
          yarn build-lint-deps
          yarn lint

      - name: Build
        run: |
          yarn workspace @fncts/transformers build && yarn workspace @fncts/transformers build-cjs
          yarn build-pack

      - name: Test
        run: |
          yarn test
